server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-store";
  }

  location = /results {
    root /usr/share/nginx/html;
    try_files /results.html =404;
    add_header Cache-Control "no-store";
  }

  location /api/ {
    proxy_pass http://api:5000;
  }
}