<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vote: DevOps Tool Poll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#eef2f7; --panel:#fff; --ink:#14213d; --muted:#5b6b86; --line:#d7dfeb; --accent:#2f5bea; --bad:#d64545; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#101729; --panel:#172038; --ink:#e8eefc; --muted:#94a3c4; --line:#263353; --accent:#6f93ff; } }
  :root[data-theme="dark"] { --bg:#101729; --panel:#172038; --ink:#e8eefc; --muted:#94a3c4; --line:#263353; --accent:#6f93ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); line-height:1.5;
    font-family:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:40px 20px 56px; }
  h1 { font-size:clamp(2rem,6vw,3.2rem); font-weight:800; letter-spacing:-.03em; line-height:1.05; margin:0 0 10px; }
  .sub { color:var(--muted); margin:0 0 28px; }
  .choices { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media (max-width:520px) { .choices { grid-template-columns:1fr; } }
  .choice { text-align:left; font:inherit; color:inherit; cursor:pointer; background:var(--panel);
    border:2px solid var(--line); border-radius:14px; padding:18px 20px; display:flex; align-items:center; gap:12px;
    font-weight:600; font-size:1.1rem; transition:border-color .15s, transform .1s; }
  .choice:hover { border-color:var(--c); }
  .choice:active { transform:scale(.98); }
  .choice .dot { width:14px; height:14px; border-radius:50%; background:var(--c); flex:none; }
  .choice[aria-pressed="true"] { border-color:var(--c); box-shadow:inset 0 0 0 1px var(--c); }
  .choice[aria-pressed="true"]::after { content:"Selected"; margin-left:auto; font-size:.8rem; font-weight:600; color:#fff; background:var(--c); padding:2px 10px; border-radius:99px; }
  .submit { margin-top:20px; width:100%; font:inherit; font-weight:800; font-size:1.1rem; padding:15px; border:0; border-radius:12px;
    background:var(--accent); color:#fff; cursor:pointer; }
  .submit:disabled { opacity:.45; cursor:not-allowed; }
  .thanks { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:32px 24px; text-align:center; }
  .thanks h2 { font-size:1.8rem; margin:0 0 8px; }
  .thanks p { color:var(--muted); margin:0 0 20px; }
  .again { font:inherit; font-weight:600; padding:11px 22px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
  .err { color:var(--bad); margin:12px 0 0; min-height:1.4em; }
  .top { display:flex; justify-content:flex-end; margin-bottom:12px; }
  .top button { font:inherit; background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; }
  [hidden] { display:none !important; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><button id="theme" type="button">Switch theme</button></div>

  <section id="ballot">
    <h1>Which DevOps tool can your team not live without?(v3)</h1>
    <p class="sub">Pick one and submit. Your vote is anonymous.</p>
    <div class="choices" id="choices"></div>
    <button class="submit" id="submit" type="button" disabled>Submit vote</button>
    <p class="err" id="err" role="alert"></p>
  </section>

  <section class="thanks" id="thanks" hidden>
    <h2>Vote recorded</h2>
    <p id="thanksMsg"></p>
    <button class="again" id="again" type="button">Vote again</button>
  </section>
</div>

<script>
  const TOOLS = { "Docker":"#2f7bff", "Kubernetes":"#0e9aa7", "Terraform":"#7b42bc",
                  "GitHub Actions":"#1f9d6b", "Trivy":"#e08a1e", "Prometheus":"#d6452f" };
  let picked = null;
  const choices = document.getElementById("choices");
  const submit = document.getElementById("submit");

  choices.innerHTML = Object.entries(TOOLS).map(([n, c]) =>
    `<button type="button" class="choice" style="--c:${c}" data-name="${n}" aria-pressed="false"><span class="dot"></span>${n}</button>`).join("");

  choices.addEventListener("click", e => {
    const b = e.target.closest(".choice"); if (!b) return;
    picked = b.dataset.name;
    choices.querySelectorAll(".choice").forEach(x => x.setAttribute("aria-pressed", x === b));
    submit.disabled = false;
  });

  submit.addEventListener("click", async () => {
    submit.disabled = true; document.getElementById("err").textContent = "";
    try {
      const res = await fetch("/api/vote/" + encodeURIComponent(picked), { method: "POST" });
      if (!res.ok) throw new Error();
      document.getElementById("thanksMsg").textContent = "Thanks, your vote for " + picked + " has been counted.";
      document.getElementById("ballot").hidden = true;
      document.getElementById("thanks").hidden = false;
    } catch (e) {
      document.getElementById("err").textContent = "Your vote was not saved. Check your connection and submit again.";
      submit.disabled = false;
    }
  });

  document.getElementById("again").addEventListener("click", () => {
    picked = null; submit.disabled = true;
    choices.querySelectorAll(".choice").forEach(x => x.setAttribute("aria-pressed", "false"));
    document.getElementById("thanks").hidden = true;
    document.getElementById("ballot").hidden = false;
  });

  document.getElementById("theme").addEventListener("click", () => {
    const dark = getComputedStyle(document.body).backgroundColor === "rgb(16, 23, 41)";
    document.documentElement.dataset.theme = dark ? "light" : "dark";
  });
</script>
</body>
</html>
