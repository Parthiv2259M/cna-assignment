name: ci-cd

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-scan-push:
    needs: secrets-scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cna-${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/cna-${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: '0'

      - name: Push image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cna-${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: build-scan-push
    runs-on: self-hosted
    steps:
      - name: Deploy to Docker Desktop Kubernetes
        shell: powershell
        run: |
          kubectl config use-context docker-desktop
          kubectl set image deployment/api api=${{ secrets.DOCKERHUB_USERNAME }}/cna-api:${{ github.sha }} -n cna
          kubectl set image deployment/web web=${{ secrets.DOCKERHUB_USERNAME }}/cna-web:${{ github.sha }} -n cna
          kubectl rollout status deployment/api -n cna --timeout=180s
          kubectl rollout status deployment/web -n cna --timeout=180s
          kubectl get pods -n cna
